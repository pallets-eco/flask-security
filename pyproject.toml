[project]
name = "Flask-Security"
description = "Quickly add security features to your Flask application."
readme.content-type = "text/x-rst"
readme.file = "README.rst"
keywords = ["flask security"]
license = { file = "LICENSE.txt" }
maintainers = [{ name = "Chris Wagner", email = "jwag.wagner+github@gmail.com"}]
authors = [{ name = "Matt Wright"}, { name = "Chris Wagner", email = "jwag.wagner+github@gmail.com"}]
requires-python = ">=3.11"
urls.Documentation = "https://flask-security.readthedocs.io"
urls.Homepage = "https://github.com/pallets-eco/flask-security"
urls.Source = "https://github.com/pallets-eco/flask-security"
urls.Tracker = "https://github.com/pallets-eco/flask-security/issues"
urls.Releases = "https://pypi.org/project/Flask-Security/"
classifiers=[
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
]
dynamic = [
  "version",
]
dependencies = [
    # flask dependencies include werkzeug, jinja2, itsdangerous, click, blinker
    "Flask>=3.1.1",
    "Flask-Login>=0.6.3",
    "Flask-Principal>=0.4.0",
    "Flask-WTF>=1.1.2",
    "email-validator>=2.3.0",
    "markupsafe>=2.1.0",
    "libpass>=1.9.3",
    "wtforms>=3.2.1",  # for form-level errors
]

[project.optional-dependencies]
babel = ["babel>=2.17.0", "flask_babel>=4.0.0", "humanize>=4.12.0"]
fsqla = ["flask_sqlalchemy>=3.1.1", "sqlalchemy>=2.0.41"]
common = ["argon2_cffi>=25.1.0", "bcrypt>=4.3.0", "flask_mail>=0.10.0", "nh3>=0.2.15"]
mfa = ["cryptography>=46.0.7", "qrcode>=8.2", "phonenumberslite>=8.13.11", "webauthn>=2.8.0"]

[dependency-groups]
tests = [
    "Flask-Babel",
    "Babel",
    "Flask-Mail",
    "Flask-SQLAlchemy",
    "Flask-SQLAlchemy-Lite",
    "argon2-cffi",
    "authlib",
    "bcrypt",
    "cbor2",
    "coverage",
    "cryptography",
    "djlint",
    "freezegun",
    "humanize",
    "mongoengine",
    "mongomock",
    "msgcheck",
    "nh3",
    "peewee",
    "phonenumberslite",
    "pydocstyle",
    "pytest-cache",
    "pytest-cov",
    "pytest",
    "qrcode",
    # authlib requires requests
    "requests",
    "sqlalchemy",
    "sqlalchemy-utils",
    "webauthn",
    "zxcvbn",
]
dev = [
    "flit",
    "check-wheel-contents",
    "psycopg2-binary",
    "pymysql",
    "pre-commit",
    "tox",
    # for dev - might not install Flask-Security - list those dependencies here
    "flask",
    "flask-wtf",
    "flask-login",
    "flask-principal",
    "markupsafe",
    "libpass",
    "email_validator",
]
low = [
    # Lowest supported versions
    "Flask==3.1.1",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-SQLAlchemy-Lite==0.1.0",
    "Flask-Babel==4.0.0",
    "Flask-Mail==0.10.0",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.1.2",
    "peewee==3.17.9",
    "argon2_cffi==21.3.0",
    "authlib==1.6.0",
    "babel==2.16.0",
    "bcrypt==4.3.0",
    "nh3==0.2.15",
    "freezegun",
    "humanize",
    "jinja2==3.1.2",
    "itsdangerous==2.2.0",
    "markupsafe==2.1.2",
    "mongoengine==0.29.1",
    "mongomock==4.3.0",
    "phonenumberslite==8.13.11",
    "qrcode==8.2.0",
    # authlib requires requests
    "requests",
    "sqlalchemy==2.0.41",
    "sqlalchemy-utils==0.42.0",
    "webauthn==2.8.0",
    "werkzeug==3.1.3",
    "zxcvbn==4.4.28"
]
docs = [
    "Pallets-Sphinx-Themes",
    "Sphinx",
    "sphinx-issues",
    "packaging",
    "Flask-SQLAlchemy",
    "sqlalchemy",
    "sqlalchemy-utils",
]

typing = [
    "basedpyright",
    "types-requests",
    "mypy",
]

[build-system]
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "flask_security"

[tool.flit.sdist]
include = [
    "AUTHORS",
    "CHANGES.rst",
    "CONTRIBUTING.rst",
    "LICENSE.txt",
    ".djlintrc",
    ".git-blame-ignore-revs",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".readthedocs.yml",
    "pyproject-too.toml",
    "babel.ini",
    "codecov.yml",
    "mypy.ini",
    "pytest.ini",
    "tox.ini",
    "docs/",
    "examples/",
    "tests/",
]
exclude = ["docs/_build/"]

[tool.djlint]
    ignore="H005,H006"  # lang, img height/width

[tool.basedpyright]
    include=["flask_security", "tests/view_scaffold.py"]
    analyzeUnannotatedFunctions = false
    reportMissingImports = false
    reportAny = false
    reportPrivateUsage = false
    failOnWarnings = false
